name: Custom.Linux.Sys.RSyslogSSHLogin
author: Antonio Blescia (TheThMando)
description: |
  Parses the auth logs to determine all SSH login attempts.

  2025-10-21T06:12:55.226470-04:00 debian sshd-session[1552]: Failed password for authority from 172.16.0.100 port 36078 ssh2
  2025-10-21T06:12:55.291900-04:00 debian sshd-session[1551]: Failed password for authority from 172.16.0.100 port 36072 ssh2
  2025-10-21T06:12:56.309421-04:00 debian sshd-session[1550]: Failed password for authority from 172.16.0.100 port 36060 ssh2
  Feb 21 08:35:22 localhost sshd[5774]: Failed password for root from 116.31.116.24 port 29160 ssh2
  Feb 20 21:54:44 localhost sshd[3402]: Accepted publickey for vagrant from 10.0.2.2 port 63673 ssh2: RSA 39:33:99:e9:a0:dc:f2:33:a3:e5:72:3b:7c:3a:56:84
  Feb 21 00:13:35 localhost sshd[7483]: Accepted password for vagrant from 192.168.33.1 port 58803 ssh2
  Feb 21 08:35:22 localhost sshd[5774]: Failed password for root from 116.31.116.24 port 29160 ssh2
  Feb 21 19:19:26 localhost sshd[16153]: Failed password for invalid user aurelien from 142.0.45.14 port 52772 ssh2
  2025-10-21T16:23:28.019362+02:00 dpp0140 sshd[64466]: Accepted password for antonio from 127.0.0.1 port 58538 ssh2

  Rispetto all'upstream Linux.Syslog.SSHLogin, estrae campi aggiuntivi:
  Port, Method (password/publickey), Signature (per chiavi pubbliche).
  Gestisce sshd-session (naming systemd) e timestamp ISO8601 oltre al
  formato syslog tradizionale.
reference:
  - https://www.elastic.co/blog/grokking-the-linux-authorization-logs

type: CLIENT

parameters:
  - name: syslogAuthLogPath
    default: /var/log/{auth.log,secure}*

  - name: SSHGrok
    description: A Grok expression for parsing SSH auth lines.
    default: >-
      (?:%{SYSLOGTIMESTAMP:Timestamp}|%{TIMESTAMP_ISO8601:Timestamp}) %{SYSLOGHOST:hostname} (?<program>sshd(?:-session)?)(?:\[%{POSINT:pid}\])?: %{DATA:event} %{DATA:method} for (invalid user )?%{DATA:user} from %{IPORHOST:ip} port %{NUMBER:port} ssh2(: %{GREEDYDATA:signature})?

sources:
  - precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      // Basic syslog parsing via GROK expressions.
      SELECT timestamp(string=Event.Timestamp) AS Time,
               Event.ip AS IP,
               Event.event AS Result,
               Event.method AS Method,
               Event.user AS AttemptedUser,
               Event.port AS Port,
               Event.signature AS Signature,
               OSPath
        FROM foreach(
          row={
              SELECT OSPath FROM glob(globs=syslogAuthLogPath)
          }, query={
              SELECT grok(grok=SSHGrok, data=Line) AS Event, OSPath
              FROM parse_lines(filename=OSPath)
              WHERE Event.program =~ "sshd*"
          })
