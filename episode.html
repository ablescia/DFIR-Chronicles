<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case file — The DFIR Chronicles</title>
<meta name="description" content="A case file from The DFIR Chronicles: the comic, and the technical note behind it.">
<meta name="theme-color" content="#08080a">
<meta property="og:type" content="article">
<meta property="og:image" content="https://ablescia.github.io/DFIR-Chronicles/assets/img/banner.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="assets/css/noir.css">
</head>
<body>

<header class="masthead" data-stuck="true">
  <a class="wordmark" href="index.html">
    <span data-site-title>The DFIR Chronicles</span>
  </a>
  <nav aria-label="Sections">
    <a data-nav="section" href="index.html#cases">All case files</a>
    <a data-nav="section" href="index.html#index">The index</a>
    <a href="#" data-repo target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>

  <!-- ── case header ───────────────────────────────────────────────────── -->
  <section class="file-hero halftone">
    <div class="file-hero__backdrop">
      <img data-file-backdrop src="" alt="" aria-hidden="true">
    </div>

    <div class="shell file-hero__grid">
      <figure class="file-cover halftone" data-intro data-reveal>
        <img data-file-cover src="" alt="" width="900" height="1350">
      </figure>

      <div>
        <p class="eyebrow" data-intro data-reveal="up" data-file-caseno>Case file</p>
        <h1 class="file-title" data-intro data-reveal data-file-title>&nbsp;</h1>

        <ul class="file-facts" data-intro data-reveal="up" data-file-facts></ul>

        <div class="file-alert" data-intro data-reveal="up" data-file-alert>
          <p class="file-alert__tag">Opening alert</p>
          <p class="file-alert__body" data-file-alert-body></p>
        </div>

        <div class="file-actions" data-intro data-reveal="up">
          <button class="btn" type="button" data-file-read>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4Z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20Z"/></svg>
            <span>Read the comic</span>
          </button>
          <a class="btn btn--ghost" data-file-pdf href="#" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
            <span>Download PDF</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- ── technical note ────────────────────────────────────────────────── -->
  <div class="shell file-body">
    <aside class="file-index">
      <h2>File index</h2>
      <ol data-file-index></ol>
    </aside>
    <article class="prose" data-note>
      <p class="eyebrow">Loading the technical note…</p>
    </article>
  </div>

  <!-- ── neighbours ────────────────────────────────────────────────────── -->
  <nav class="shell file-nav" aria-label="Other case files">
    <a class="file-nav__link file-nav__link--prev" href="#" data-prev>
      <span class="eyebrow" data-nav-label></span>
      <span class="file-nav__title" data-nav-title></span>
    </a>
    <a class="file-nav__link file-nav__link--next" href="#" data-next>
      <span class="eyebrow" data-nav-label></span>
      <span class="file-nav__title" data-nav-title></span>
    </a>
  </nav>

</main>

<!-- ── the reader ──────────────────────────────────────────────────────── -->
<div class="reader" role="dialog" aria-modal="true" aria-label="Comic reader">
  <div class="reader__bar">
    <p class="reader__label" data-reader-label></p>
    <span class="reader__spacer"></span>
    <button class="reader__close" type="button" aria-label="Close the reader">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <iframe class="reader__frame" title="Comic PDF"></iframe>
</div>

<footer class="footer">
  <div class="shell footer__grid">
    <p><span data-site-title>The DFIR Chronicles</span> — © <span data-year></span></p>
    <p><a href="index.html">Back to the case files</a></p>
    <p><a href="#" data-repo target="_blank" rel="noopener">Source repository</a></p>
  </div>
</footer>

<script src="assets/vendor/js-yaml.min.js"></script>
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/js/chronicles.js"></script>
<script src="assets/js/file.js"></script>
</body>
</html>
